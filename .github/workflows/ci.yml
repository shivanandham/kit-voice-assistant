name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kit
          POSTGRES_PASSWORD: kit
          POSTGRES_DB: kit_assistant_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kit -d kit_assistant_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Third-party services are stubbed in tests; a network guard fails any test that reaches a real host.
      TEST_DATABASE_URL: postgresql://kit:kit@localhost:5432/kit_assistant_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Enable pgvector
        run: PGPASSWORD=kit psql -h localhost -U kit -d kit_assistant_test -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Lint
        run: uv run ruff check backend/app scripts
      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing
